name: Fontory
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  FontoryCore:
    path: Packages/FontoryCore
targets:
  Fontory:
    type: application
    platform: macOS
    sources:
      - path: App/Fontory
        excludes:
          - Templates
      - path: App/Fontory/Templates
        type: folder
        buildPhase: resources
    dependencies:
      - package: FontoryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fontory.app
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Fontory/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
